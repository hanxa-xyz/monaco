[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "monaco"
version = "0.1.0"
description = "A data-science toolkit with one house grammar: charts, EDA vocabulary, exploratory modelling, funnel/cohort and partner-health analytics, and readouts that cannot skip the close."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "David Bang" }]
dependencies = [
  "numpy>=1.23",
  "pandas>=1.5",
  "matplotlib>=3.6",
  "duckdb>=0.9",
  "scipy>=1.9",
]

[project.optional-dependencies]
model = ["scikit-learn>=1.2", "xgboost>=1.7"]
notebook = ["nbformat>=5.7", "nbconvert>=7.0", "ipykernel>=6.20", "jupyter_client>=7.4"]
live = ["requests>=2.28"]
dev = ["pytest>=7.0", "ruff>=0.4"]
all = ["monaco[model,notebook,live,dev]"]

[project.scripts]
monaco-sandbox = "monaco.sandbox.load_sandbox:main"
monaco-funnel = "monaco.cli_funnel:main"
monaco-partner-health = "monaco.cli_partner_health:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
monaco = ["assets/*.css", "templates/*", "sandbox/*.sql", "sandbox/sql/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]

[tool.ruff]
line-length = 140
target-version = "py39"
extend-exclude = ["notebooks", "data", "out"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
# E501/E701/E702: the analytics modules use dense one-line statements and long f-strings on purpose
ignore = ["E402", "E501", "E701", "E702", "E731", "E741"]
